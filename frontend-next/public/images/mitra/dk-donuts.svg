<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none">
  <!-- Large Yellow / Orange 'd' -->
  <g transform="translate(10, 10)">
    <!-- d -->
    <path d="M 18 10 L 32 10 L 32 34 C 32 30 24 28 16 34 C 6 42 6 62 16 70 C 24 76 32 72 32 72 L 32 76 L 46 76 L 46 10 L 18 10 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
    <ellipse cx="26" cy="52" rx="7" ry="10" fill="#ffffff"/>

    <!-- k -->
    <path d="M 52 10 L 66 10 L 66 42 L 82 24 L 100 24 L 78 48 L 102 76 L 84 76 L 66 54 L 66 76 L 52 76 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>

    <!-- Brown oval for donuts & COFFEE -->
    <g transform="translate(68, 5)">
      <ellipse cx="44" cy="28" rx="42" ry="24" fill="#451a03" stroke="#b45309" stroke-width="1.5"/>
      <text x="44" y="24" font-family="'Arial Black', sans-serif" font-weight="900" font-size="13" fill="#fef08a" text-anchor="middle" font-style="italic">donuts</text>
      <text x="44" y="38" font-family="'Arial Black', sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle" letter-spacing="1">COFFEE</text>
    </g>

    <!-- Coffee Cup -->
    <g transform="translate(110, 42)">
      <path d="M 0 6 Q 0 24 16 24 Q 32 24 32 6 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
      <path d="M 28 10 Q 36 10 36 16 Q 36 22 28 22" fill="none" stroke="#ca8a04" stroke-width="2"/>
      <path d="M -4 26 L 36 26" stroke="#ca8a04" stroke-width="2" stroke-linecap="round"/>
      <!-- Steam -->
      <path d="M 8 0 Q 10 -4 8 -8" stroke="#ca8a04" stroke-width="1" fill="none"/>
      <path d="M 16 0 Q 18 -4 16 -8" stroke="#ca8a04" stroke-width="1" fill="none"/>
      <path d="M 24 0 Q 26 -4 24 -8" stroke="#ca8a04" stroke-width="1" fill="none"/>
      <!-- Signature ds -->
      <text x="16" y="16" font-family="'Brush Script MT', cursive" font-size="9" fill="#78350f" text-anchor="middle">ds</text>
    </g>

    <!-- Subtitle -->
    <text x="60" y="94" font-family="'Arial', sans-serif" font-weight="bold" font-size="7" fill="#854d0e" letter-spacing="1.5" text-anchor="middle">DKU DONUTS INDONESIA</text>
