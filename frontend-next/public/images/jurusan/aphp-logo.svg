<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" className="w-full h-full">
  <!-- White Background with soft gradient -->
  <rect width="600" height="600" rx="36" fill="#ffffff"/>
  
  <g transform="translate(300, 240)">
    <!-- Outer Black Ring -->
    <circle cx="0" cy="0" r="160" stroke="#18181b" stroke-width="26" fill="#fbbf24"/>
    
    <!-- Inner Emblem / Gear & Grain Stalk (White Icon Graphics) -->
    <!-- Gear Half (Left & Lower) -->
    <g fill="#ffffff" stroke="#ffffff" stroke-width="2">
      <!-- Upper Left Gear Segment -->
      <path d="M 0 -85 A 85 85 0 0 0 -85 0 L -55 0 A 55 55 0 0 1 0 -55 Z" />
      <rect x="-92" y="-12" width="24" height="24" rx="3" transform="rotate(0 -80 0)" />
      <rect x="-85" y="-55" width="22" height="24" rx="3" transform="rotate(-30 -74 -43)" />
      <rect x="-55" y="-85" width="22" height="24" rx="3" transform="rotate(-60 -44 -73)" />
      <rect x="-12" y="-95" width="24" height="24" rx="3" transform="rotate(-90 0 -83)" />
      
      <!-- Lower Arc Ring -->
      <path d="M -85 0 A 85 85 0 0 0 0 85 L 0 55 A 55 55 0 0 1 -55 0 Z" />
      <path d="M 0 85 A 85 85 0 0 0 85 0 L 55 0 A 55 55 0 0 1 0 55 Z" />
      
      <!-- Lower Right Gear Cogs -->
      <rect x="70" y="-12" width="24" height="24" rx="3" transform="rotate(0 82 0)" />
      <rect x="60" y="35" width="22" height="24" rx="3" transform="rotate(30 71 47)" />
      <rect x="35" y="60" width="22" height="24" rx="3" transform="rotate(60 46 72)" />
      <rect x="-12" y="70" width="24" height="24" rx="3" transform="rotate(90 0 82)" />
      
      <!-- Upper Right Grains / Wheat Stalk Segment (Radial Bars) -->
      <g transform="rotate(0)">
        <rect x="10" y="-86" width="10" height="24" rx="3" transform="rotate(10 15 -74)" />
        <rect x="32" y="-80" width="10" height="24" rx="3" transform="rotate(25 37 -68)" />
        <rect x="52" y="-70" width="10" height="24" rx="3" transform="rotate(40 57 -58)" />
        <rect x="68" y="-54" width="10" height="24" rx="3" transform="rotate(55 73 -42)" />
        <rect x="78" y="-34" width="10" height="24" rx="3" transform="rotate(70 83 -22)" />
        <rect x="82" y="-12" width="10" height="24" rx="3" transform="rotate(85 87 0)" />
      </g>
    </g>
  </g>

  <!-- Typography: APHP -->
  <text x="300" y="475" font-family="'Arial Black', 'Montserrat', 'Trebuchet MS', sans-serif" font-weight="900" font-size="76" fill="#f59e0b" text-anchor="middle" letter-spacing="4">APHP</text>
  
  <!-- Subtitle: — SMKN 2 Mojokerto — -->
  <g transform="translate(300, 515)">
    <!-- Left Accent Line -->
    <line x1="-190" y1="-5" x2="-145" y2="-5" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Text -->
    <text x="0" y="0" font-family="'Arial', 'Segoe UI', sans-serif" font-weight="800" font-size="21" fill="#18181b" text-anchor="middle" letter-spacing="1.5">SMKN 2 Mojokerto</text>
    
    <!-- Right Accent Line -->
    <line x1="145" y1="-5" x2="190" y2="-5" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
